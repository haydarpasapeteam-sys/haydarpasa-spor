media:
  input: ""
  output: ""

content:
  - name: duyurular
    label: "Duyurular Panosu"
    type: file
    path: "duyurular.json"
    fields:
      - name: liste
        label: "Duyuru Listesi"
        type: list
        fields:
          - name: baslik
            label: "Duyuru Başlığı"
            type: string
            required: true
          - name: kategori
            label: "Kategori (örn: TURNUVA, SEÇMELER, SONUÇLAR)"
            type: string
          - name: tarih_saat
            label: "Tarih ve Saat (örn: 29 Eyl • 12:00)"
            type: string
          - name: aciklama
            label: "Kısa Açıklama"
            type: text
          - name: resim
            label: "Afiş Görseli (Dosyadan Seç/Yükle)"
            type: file
          - name: form_linki
            label: "Başvuru Formu veya Sonuç Linki"
            type: string
          - name: belge_linki
            label: "Veli İzin Belgesi / Dosya (Dosyadan Seç/Yükle)"
            type: file

  - name: resmi_belgeler
    label: "Okul Resmi Evrakları ve İzin Formları"
    type: file
    path: "belgeler.json"
    fields:
      - name: veli_izin_pdf
        label: "Takım Seçmeleri & Turnuva Veli İzin Belgesi (PDF Seç/Yükle)"
        type: file
      - name: taahhutname_link
        label: "Kullanım Taahhütnamesi Sayfası / Dosyası"
        type: string
        default: "taahhutname.html"
      - name: ders_disi_link
        label: "Ders Dışı Egzersiz İzin Formu Sayfası / Dosyası"
        type: string
        default: "ders_disi_egzersiz.html"
      - name: saglik_beyan_link
        label: "Sağlık Beyan Formu Sayfası / Dosyası"
        type: string
        default: "saglik_durumu.html"
