media:
  input: images
  output: images

content:
  - name: duyurular
    label: "Duyurular Panosu"
    type: file
    path: duyurular.json
    fields:
      - name: liste
        label: "Duyuru Listesi"
        type: object
        list: true
        fields:
          - name: baslik
            label: "Duyuru Başlığı"
            type: string
          - name: kategori
            label: "Kategori (örn: TURNUVA, SEÇMELER)"
            type: string
          - name: tarih_saat
            label: "Tarih ve Saat"
            type: string
          - name: aciklama
            label: "Açıklama"
            type: text
          - name: resim
            label: "Afiş Görseli"
            type: image
          - name: form_linki
            label: "Form Linki"
            type: string
          - name: belge_linki
            label: "Belge Linki"
            type: string
