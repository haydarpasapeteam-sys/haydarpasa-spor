media:
  input: ""
  output: ""

content:
  - name: duyurular
    label: "Duyurular Panosu"
    type: file
    path: "duyurular.json"
    fields:
      - name: liste
        label: "Duyuru Listesi"
        type: list
        fields:
          - name: baslik
            label: "Duyuru Başlığı"
            type: string
            required: true
          - name: kategori
            label: "Kategori (örn: TURNUVA, SEÇMELER, SONUÇLAR)"
            type: string
          - name: tarih_saat
            label: "Tarih ve Saat"
            type: string
          - name: aciklama
            label: "Açıklama"
            type: text
          - name: resim
            label: "Afiş Görseli"
            type: image
          - name: form_linki
            label: "Başvuru Formu / Canva Sonuç Linki"
            type: string
          - name: belge_linki
            label: "Veli İzin Belgesi / Dosya"
            type: file

  - name: resmi_belgeler
    label: "Okul Resmi Evrakları ve İzin Formları"
    type: file
    path: "belgeler.json"
    fields:
      - name: veli_izin_pdf
        label: "Veli İzin Belgesi (PDF Seç/Yükle)"
        type: file
      - name: taahhutname_link
        label: "Kullanım Taahhütnamesi Linki"
        type: string
      - name: ders_disi_link
        label: "Ders Dışı Egzersiz İzin Formu Linki"
        type: string
      - name: saglik_beyan_link
        label: "Sağlık Beyan Formu Linki"
        type: string