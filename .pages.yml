media:
  input: ""
  output: ""

content:
  - name: duyurular
    label: Duyurular Panosu
    type: collection
    path: duyurular
    format: json
    fields:
      - name: baslik
        label: Duyuru Basligi
        type: string
        required: true
      - name: kategori
        label: Kategori
        type: string
      - name: tarih_saat
        label: Tarih ve Saat
        type: string
      - name: aciklama
        label: Aciklama
        type: text
      - name: resim
        label: Afis Resmi
        type: image
      - name: form_linki
        label: Form Linki
        type: string
      - name: belge_linki
        label: Belge Linki
        type: string

  - name: isg_belgeleri
    label: İş Sağlığı ve Güvenliği (İSG)
    type: collection
    path: isg
    format: json
    fields:
      - name: baslik
        label: Belge / Talimat Adı
        type: string
        required: true
      - name: aciklama
        label: Kısa Açıklama (Örn: Salon ve Havuz Kuralları)
        type: string
      - name: dosya
        label: PDF veya Belge Dosyası
        type: file
      - name: link
        label: Harici Link (Drive vb. varsa)
        type: string