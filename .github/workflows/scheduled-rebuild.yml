name: Scheduled rebuild

# Static sites cannot execute server code at request time, so scheduled
# publishing/expiry (spec §10) works by rebuilding periodically: each run
# re-evaluates every announcement's publishAt/expiresAt against "now" and
# regenerates the static pages accordingly. This means publication and
# expiry are only as timely as this schedule — not second-level precise.
# Runs are also idempotent no-ops when nothing has crossed a publish/expiry
# boundary since the last build (content is unchanged, so the rebuilt
# output is identical and the deploy step just republishes the same site).

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild for time-sensitive content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Cache generated image derivatives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: public/media/images/_derived
          key: img-derived-${{ hashFiles('public/media/images/**/*.png', 'public/media/images/**/*.jpg', 'public/media/images/**/*.jpeg') }}
          restore-keys: |
            img-derived-

      - name: Validate content, links, documents
        run: pnpm run validate

      - name: Optimize images
        run: pnpm run optimize:images

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build (re-evaluates publishAt/expiresAt against current time)
        run: pnpm run build:unsafe

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
